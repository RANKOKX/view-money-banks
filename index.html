<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201c">
<title>Bank – mon argent</title>
<style>
:root{--bg:#14201c;--card:#1d2d27;--line:#2c4238;--txt:#eef3ee;--mut:#8fa89c;--gain:#7fe3a0;--loss:#ff8a7a;--acc:#f2c14e;--ink:#14201c}
@media (prefers-color-scheme:light){:root{--bg:#f2f5ef;--card:#fff;--line:#d5ded4;--txt:#16241e;--mut:#5c7267;--gain:#1f9d55;--loss:#d6452f;--acc:#e0a91c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 Georgia,"Times New Roman",serif}
#app{max-width:560px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom))}
h1,h2{font-weight:normal;margin:0}
h2{font-size:20px;margin-bottom:12px}
.total{padding:14px 4px 6px}
.total small{color:var(--mut)}
.total b{display:block;font-size:50px;letter-spacing:-1px;font-weight:normal;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
input,select,button{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
input[type=color]{padding:2px;height:46px}
button{cursor:pointer}
.main{background:var(--acc);color:var(--ink);border:0;font-weight:bold}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:8px}
.bank,.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.card>.bank:first-of-type,.card>.tx:first-of-type{border-top:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--mut)}
.num{font-variant-numeric:tabular-nums;font-weight:bold}
.g{color:var(--gain)}.l{color:var(--loss)}
.x{width:auto;background:none;border:0;color:var(--mut);padding:6px 10px}
.empty{color:var(--mut);padding:8px 0}
svg{width:100%;height:auto;display:block}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nav button{width:46px;height:46px;padding:0;font-size:22px;flex:none}
.nav h2{flex:1;text-align:center;margin:0;font-size:18px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;color:var(--mut);justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bar button{border:0;border-radius:0;background:none;color:var(--mut);padding:14px 4px;font-size:14px}
.bar button.on{color:var(--acc);font-weight:bold}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;padding:0;font-size:34px;line-height:1;background:var(--acc);color:var(--ink);border:0;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:5}
.veil.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:auto;z-index:6}
.choice{display:flex;justify-content:space-between;align-items:center;text-align:left;margin-bottom:8px;padding:16px;font-size:17px}
.choice span{color:var(--mut);font-size:22px}
.back{width:auto;display:inline-block;background:none;border:0;color:var(--mut);padding:4px 0;margin-bottom:8px}
@media (prefers-reduced-motion:no-preference){button{transition:transform .1s}button:active{transform:scale(.97)}}
</style>
</head>
<body>
<div id="app"></div>

<button class="fab" aria-label="Ajouter" onclick="openSheet('menu')">+</button>
<div class="bar" id="bar"></div>
<div class="veil" id="veil" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

<script>
const $=s=>document.getElementById(s);
let S;try{S=JSON.parse(localStorage.getItem('bank-app'))}catch(e){}
if(!S||!S.banks)S={banks:[],tx:[]};
let screen=0,ci=0,filt='all',lastBank='';
const save=()=>{try{localStorage.setItem('bank-app',JSON.stringify(S))}catch(e){}};
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const fd=d=>d.split('-').reverse().join('/');
const bal=b=>b.init+S.tx.filter(t=>t.bank===b.id).reduce((a,t)=>a+t.amt,0);
const total=()=>S.banks.reduce((a,b)=>a+bal(b),0);
const sum=a=>a.reduce((x,y)=>x+y,0);

/* ---------- Création (sous-menu) ---------- */
function openSheet(m){$('veil').classList.add('show');sheet(m)}
function closeSheet(){$('veil').classList.remove('show')}
function sheet(m){
  const el=$('sheet');
  if(m==='menu'){
    el.innerHTML=`<h2>Que veux-tu ajouter ?</h2>
    <button class="choice" onclick="sheet('in')">J’ai reçu de l’argent <span>›</span></button>
    <button class="choice" onclick="sheet('out')">J’ai dépensé <span>›</span></button>
    <button class="choice" onclick="sheet('bank')">Une nouvelle banque <span>›</span></button>`;
  }else if(m==='bank'){
    el.innerHTML=`<button class="back" onclick="sheet('menu')">‹ Retour</button><h2>Nouvelle banque</h2>
    <div class="row" style="grid-template-columns:1fr 64px"><input id="bn" placeholder="Nom de la banque"><input id="bc" type="color" value="#f2c14e" aria-label="Couleur"></div>
    <input id="bi" type="number" inputmode="decimal" step="0.01" placeholder="Argent déjà dessus (€)" style="margin-bottom:8px">
    <button class="main" onclick="addBank()">Créer la banque</button>`;
  }else{
    const s=m==='in';
    if(!S.banks.length){el.innerHTML=`<button class="back" onclick="sheet('menu')">‹ Retour</button><h2>${s?'J’ai reçu':'J’ai dépensé'}</h2><p class="empty">Crée d’abord une banque pour y mettre ton argent.</p><button class="main" onclick="sheet('bank')">Créer une banque</button>`;return}
    el.innerHTML=`<button class="back" onclick="sheet('menu')">‹ Retour</button><h2>${s?'J’ai reçu de l’argent':'J’ai dépensé'}</h2>
    <div class="row"><input id="amt" type="number" inputmode="decimal" step="0.01" placeholder="Montant (€)"><select id="bank">${S.banks.map(b=>`<option value="${b.id}" ${b.id===lastBank?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
    <div class="row"><input id="date" type="date" value="${today()}"><input id="note" placeholder="Note (facultatif)"></div>
    <button class="main" onclick="addTx(${s?1:-1})">Enregistrer</button>`;
    $('amt').focus();
  }
}
function addBank(){
  const n=$('bn').value.trim();if(!n)return $('bn').focus();
  S.banks.push({id:'b'+Date.now(),name:n,color:$('bc').value,init:parseFloat($('bi').value)||0});
  save();closeSheet();render();
}
function addTx(t){
  const a=parseFloat($('amt').value);if(!a)return $('amt').focus();
  lastBank=$('bank').value;
  S.tx.push({id:'t'+Date.now(),bank:lastBank,amt:Math.abs(a)*t,date:$('date').value||today(),note:$('note').value.trim()});
  save();closeSheet();render();
}
function delBank(id){if(!confirm('Supprimer cette banque et son historique ?'))return;S.banks=S.banks.filter(b=>b.id!==id);S.tx=S.tx.filter(t=>t.bank!==id);save();render()}
function delTx(id){S.tx=S.tx.filter(t=>t.id!==id);save();render()}

/* ---------- Graphiques ---------- */
const mk=(svg,leg)=>({svg,leg:leg||''});
const none=m=>mk(`<div class="empty">${m}</div>`);
function bars(lbl,g,l,step){
  const mx=Math.max(1,...g,...l),W=320,H=190,mid=95,n=lbl.length,bw=(W-20)/n;let s=`<line x1="10" x2="${W-10}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>`;
  lbl.forEach((d,i)=>{const x=10+i*bw+bw*.15,w=bw*.7,a=g[i]/mx*(mid-14),b=l[i]/mx*(mid-14);
    s+=`<rect x="${x}" y="${mid-a}" width="${w}" height="${a}" rx="3" fill="var(--gain)"/><rect x="${x}" y="${mid}" width="${w}" height="${b}" rx="3" fill="var(--loss)"/>`;
    if(i%step===0)s+=`<text x="${x+w/2}" y="${H-4}" text-anchor="middle" fill="var(--mut)" font-size="9">${d}</text>`});
  return mk(`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`,'<span><i style="background:var(--gain)"></i>Reçu</span><span><i style="background:var(--loss)"></i>Dépensé</span>');
}
function lineData(banks){
  const days=[...new Set(S.tx.map(t=>t.date))].sort();
  return {days,series:banks.map(b=>{let run=b.init;return {b,v:[run,...days.map(d=>(run+=S.tx.filter(t=>t.bank===b.id&&t.date===d).reduce((a,t)=>a+t.amt,0)))]}})};
}
function lines(multi){
  if(!S.banks.length)return none('Ajoute une banque pour voir ce graphique.');
  const {days,series}=lineData(S.banks);
  if(!days.length)return none('Ajoute un gain ou une dépense pour voir la courbe.');
  const lab=['Départ',...days.map(d=>fd(d).slice(0,5))];
  const list=multi?series:[{b:{color:'var(--acc)',name:'Total'},v:lab.map((_,i)=>sum(series.map(s=>s.v[i])))}];
  const all=list.flatMap(s=>s.v),mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn)||1,W=320,H=190,p=26,n=lab.length;
  const X=i=>p+(n>1?i/(n-1):.5)*(W-2*p),Y=v=>H-p-(v-mn)/rg*(H-2*p-8);
  let s=`<text x="${p}" y="12" fill="var(--mut)" font-size="11">${eur(mx)}</text><text x="${p}" y="${H-4}" fill="var(--mut)" font-size="11">${eur(mn)}</text>`;
  list.forEach(q=>{const pts=q.v.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    if(!multi)s+=`<polygon points="${X(0)},${H-p} ${pts} ${X(n-1)},${H-p}" fill="var(--acc)" opacity=".15"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="${q.b.color}" stroke-width="3" stroke-linejoin="round"/>`+q.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${q.b.color}"/>`).join('')});
  return mk(`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`,multi?list.map(q=>`<span><i style="background:${q.b.color}"></i>${esc(q.b.name)}</span>`).join(''):'<span>Ton total, jour après jour</span>');
}
const CH=[
 {t:'Répartition',f(){
  const it=S.banks.map(b=>({b,v:Math.max(0,bal(b))})).filter(x=>x.v>0),sm=sum(it.map(x=>x.v));
  if(!sm)return none('Aucun argent pour l’instant.');
  const r=70,C=2*Math.PI*r;let off=0,a='',lg='';
  it.forEach(x=>{const l=x.v/sm*C;a+=`<circle r="${r}" cx="100" cy="100" fill="none" stroke="${x.b.color}" stroke-width="30" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=l;lg+=`<span><i style="background:${x.b.color}"></i>${esc(x.b.name)} ${Math.round(x.v/sm*100)} %</span>`});
  return mk(`<svg viewBox="0 0 200 200" style="max-width:260px;margin:auto">${a}<text x="100" y="106" text-anchor="middle" fill="currentColor" font-size="17" font-family="Georgia">${eur(sm)}</text></svg>`,lg)}},
 {t:'Soldes par banque',f(){
  if(!S.banks.length)return none('Ajoute une banque pour voir ce graphique.');
  const mx=Math.max(1,...S.banks.map(b=>Math.abs(bal(b)))),h=44,H=S.banks.length*h+6;
  return mk(`<svg viewBox="0 0 320 ${H}">${S.banks.map((b,i)=>{const v=bal(b),w=Math.abs(v)/mx*220,y=i*h+4;return `<text x="0" y="${y+11}" fill="var(--mut)" font-size="12">${esc(b.name)}</text><rect x="0" y="${y+16}" width="${Math.max(w,3)}" height="18" rx="5" fill="${b.color}"/><text x="${Math.max(w,3)+8}" y="${y+30}" fill="currentColor" font-size="12">${eur(v)}</text>`}).join('')}</svg>`)}},
 {t:'Évolution du total',f:()=>lines(false)},
 {t:'Évolution par banque',f:()=>lines(true)},
 {t:'14 derniers jours',f(){
  const ds=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push(d.toLocaleDateString('sv'))}
  const q=(d,s)=>sum(S.tx.filter(t=>t.date===d&&t.amt*s>0).map(t=>Math.abs(t.amt)));
  return bars(ds.map(d=>d.slice(8)+'/'+d.slice(5,7)),ds.map(d=>q(d,1)),ds.map(d=>q(d,-1)),3)}},
 {t:'Mois par mois',f(){
  const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push(d.toLocaleDateString('sv').slice(0,7))}
  const q=(m,s)=>sum(S.tx.filter(t=>t.date.slice(0,7)===m&&t.amt*s>0).map(t=>Math.abs(t.amt)));
  return bars(ms.map(m=>new Date(m+'-02').toLocaleDateString('fr-FR',{month:'short'})),ms.map(m=>q(m,1)),ms.map(m=>q(m,-1)),1)}}
];
function go(d){ci=(ci+d+CH.length)%CH.length;render()}

/* ---------- Écrans ---------- */
const txRow=t=>{const b=S.banks.find(x=>x.id===t.bank);return `<div class="tx"><i class="dot" style="background:${b?b.color:'#888'}"></i><div class="grow">${esc(t.note||(t.amt>0?'Reçu':'Dépensé'))}<small>${fd(t.date)} · ${b?esc(b.name):''}</small></div><span class="num ${t.amt>0?'g':'l'}">${t.amt>0?'+':''}${eur(t.amt)}</span><button class="x" aria-label="Supprimer" onclick="delTx('${t.id}')">✕</button></div>`};
const sorted=()=>[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
const bankRow=(b,del)=>`<div class="bank"><i class="dot" style="background:${b.color}"></i><span class="grow">${esc(b.name)}</span><span class="num ${bal(b)<0?'l':''}">${eur(bal(b))}</span>${del?`<button class="x" aria-label="Supprimer" onclick="delBank('${b.id}')">✕</button>`:''}</div>`;

function render(){
  let h='';
  if(screen===0){
    const L=sorted().slice(0,5);
    h=`<div class="total"><small>Mon argent au total</small><b>${eur(total())}</b></div>
    <div class="card"><h2>Mes banques</h2>${S.banks.length?S.banks.map(b=>bankRow(b)).join(''):'<div class="empty">Appuie sur + pour créer ta première banque.</div>'}</div>
    <div class="card"><h2>Derniers mouvements</h2>${L.length?L.map(txRow).join(''):'<div class="empty">Rien pour l’instant.</div>'}</div>`;
  }else if(screen===1){
    const c=CH[ci].f();
    h=`<div class="card"><div class="nav"><button aria-label="Précédent" onclick="go(-1)">‹</button><h2>${CH[ci].t}</h2><button aria-label="Suivant" onclick="go(1)">›</button></div>
    <div id="cv">${c.svg}</div><div class="legend">${c.leg}</div>
    <div class="dots">${CH.map((_,i)=>`<i class="${i===ci?'on':''}"></i>`).join('')}</div></div>`;
  }else if(screen===2){
    const L=sorted().filter(t=>filt==='all'||t.bank===filt).slice(0,100);
    h=`<h2 style="padding:14px 4px 0">Historique</h2><div class="card"><select onchange="filt=this.value;render()"><option value="all">Toutes les banques</option>${S.banks.map(b=>`<option value="${b.id}" ${filt===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
    <div class="card">${L.length?L.map(txRow).join(''):'<div class="empty">Rien pour l’instant.</div>'}</div>`;
  }else{
    h=`<h2 style="padding:14px 4px 0">Banques</h2><div class="card">${S.banks.length?S.banks.map(b=>bankRow(b,1)).join(''):'<div class="empty">Aucune banque.</div>'}<button class="main" style="margin-top:10px" onclick="openSheet('bank')">Ajouter une banque</button></div>
    <div class="card"><h2>Sauvegarde</h2><div class="row"><button onclick="exp()">Exporter</button><button onclick="$('imp').click()">Importer</button></div><input id="imp" type="file" accept="application/json" hidden onchange="imp(this)"></div>`;
  }
  $('app').innerHTML=h;
  $('bar').innerHTML=['Accueil','Graphiques','Historique','Banques'].map((n,i)=>`<button class="${i===screen?'on':''}" onclick="screen=${i};render();scrollTo(0,0)">${n}</button>`).join('');
  const cv=$('cv');if(cv){let x0=0;cv.ontouchstart=e=>x0=e.touches[0].clientX;cv.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(d<0?1:-1)}}
}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='bank-sauvegarde.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d.banks&&d.tx){S=d;save();render()}else alert('Fichier invalide')}catch(e){alert('Fichier invalide')}})}
render();
</script>
</body>
</html>
