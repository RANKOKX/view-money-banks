<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201c">
<title>Bank – mon argent</title>
<style>
:root{--bg:#14201c;--card:#1d2d27;--line:#2c4238;--txt:#eef3ee;--mut:#8fa89c;--gain:#7fe3a0;--loss:#ff8a7a;--acc:#f2c14e}
@media (prefers-color-scheme:light){:root{--bg:#f2f5ef;--card:#fff;--line:#d5ded4;--txt:#16241e;--mut:#5c7267;--gain:#1f9d55;--loss:#d6452f;--acc:#b8860b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 Georgia,"Times New Roman",serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:560px;margin-inline:auto}
h1,h2{font-weight:normal;margin:0}
.total{padding:20px 4px 8px}
.total small{color:var(--mut);font-size:15px}
.total b{display:block;font-size:48px;letter-spacing:-1px;font-weight:normal;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:18px;margin-bottom:10px}
input,select,button{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
input[type=color]{padding:2px;height:44px}
button{cursor:pointer;background:var(--acc);color:#14201c;border:0;font-weight:bold}
button.ghost{background:none;color:var(--mut);border:1px solid var(--line);font-weight:normal}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:8px}
.row.one{grid-template-columns:1fr}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.seg button{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.seg button.on.g{background:var(--gain);color:#14201c;border-color:var(--gain)}
.seg button.on.l{background:var(--loss);color:#14201c;border-color:var(--loss)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{background:none;color:var(--mut);border:1px solid var(--line);padding:8px;font-weight:normal;font-size:14px}
.tabs button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.bank{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.bank:first-of-type{border-top:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.bank span.n{flex:1}
.num{font-variant-numeric:tabular-nums}
.g{color:var(--gain)}.l{color:var(--loss)}
.x{width:auto;background:none;color:var(--mut);padding:4px 8px;font-weight:normal;border:0}
.tx{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tx small{color:var(--mut);display:block}
.tx div{flex:1}
.empty{color:var(--mut);padding:8px 0}
svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (prefers-reduced-motion:no-preference){button{transition:transform .1s}button:active{transform:scale(.97)}}
</style>
</head>
<body>

<div class="total"><small>Mon argent au total</small><b id="total">0 €</b></div>

<div class="card">
  <h2>Ajouter aujourd’hui</h2>
  <div class="seg">
    <button id="bG" class="on g" onclick="setType(1)">J’ai reçu</button>
    <button id="bL" class="l" onclick="setType(-1)">J’ai dépensé</button>
  </div>
  <div class="row">
    <input id="amt" type="number" inputmode="decimal" step="0.01" placeholder="Montant (€)">
    <select id="bank"></select>
  </div>
  <div class="row">
    <input id="date" type="date">
    <input id="note" placeholder="Note (facultatif)">
  </div>
  <button onclick="addTx()">Enregistrer</button>
</div>

<div class="card">
  <h2>Graphiques</h2>
  <div class="tabs">
    <button class="on" onclick="tab(0,this)">Répartition</button>
    <button onclick="tab(1,this)">Évolution</button>
    <button onclick="tab(2,this)">Par jour</button>
  </div>
  <div id="chart"></div>
  <div class="legend" id="legend"></div>
</div>

<div class="card">
  <h2>Mes banques</h2>
  <div id="banks"></div>
  <div class="row" style="margin-top:10px;grid-template-columns:1fr 64px">
    <input id="bn" placeholder="Nom de la banque">
    <input id="bc" type="color" value="#f2c14e" aria-label="Couleur">
  </div>
  <div class="row">
    <input id="bi" type="number" inputmode="decimal" step="0.01" placeholder="Argent déjà dessus (€)">
    <button onclick="addBank()">Ajouter la banque</button>
  </div>
</div>

<div class="card">
  <h2>Historique</h2>
  <div id="list"></div>
</div>

<div class="card">
  <h2>Sauvegarde</h2>
  <div class="tools">
    <button class="ghost" onclick="exp()">Exporter</button>
    <button class="ghost" onclick="document.getElementById('imp').click()">Importer</button>
  </div>
  <input id="imp" type="file" accept="application/json" hidden onchange="imp(this)">
</div>

<script>
const $=s=>document.getElementById(s);
let S;
try{S=JSON.parse(localStorage.getItem('bank-app'))}catch(e){}
if(!S||!S.banks)S={banks:[],tx:[]};
let type=1,view=0;
const save=()=>{try{localStorage.setItem('bank-app',JSON.stringify(S))}catch(e){}};
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const bal=b=>b.init+S.tx.filter(t=>t.bank===b.id).reduce((a,t)=>a+t.amt,0);
const total=()=>S.banks.reduce((a,b)=>a+bal(b),0);

function setType(t){type=t;$('bG').className=t>0?'on g':'g';$('bL').className=t<0?'on l':'l'}
function tab(i,el){view=i;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));el.classList.add('on');chart()}

function addBank(){
  const n=$('bn').value.trim();if(!n)return $('bn').focus();
  S.banks.push({id:'b'+Date.now(),name:n,color:$('bc').value,init:parseFloat($('bi').value)||0});
  $('bn').value='';$('bi').value='';save();render();
}
function delBank(id){
  if(!confirm('Supprimer cette banque et son historique ?'))return;
  S.banks=S.banks.filter(b=>b.id!==id);S.tx=S.tx.filter(t=>t.bank!==id);save();render();
}
function addTx(){
  const a=parseFloat($('amt').value);
  if(!a||!$('bank').value)return $('amt').focus();
  S.tx.push({id:'t'+Date.now(),bank:$('bank').value,amt:Math.abs(a)*type,date:$('date').value||today(),note:$('note').value.trim()});
  $('amt').value='';$('note').value='';save();render();
}
function delTx(id){S.tx=S.tx.filter(t=>t.id!==id);save();render()}

function chart(){
  const el=$('chart'),lg=$('legend');lg.innerHTML='';
  if(!S.banks.length){el.innerHTML='<div class="empty">Ajoute une banque pour voir tes graphiques.</div>';return}
  if(view===0){
    const items=S.banks.map(b=>({b,v:Math.max(0,bal(b))})).filter(x=>x.v>0),sum=items.reduce((a,x)=>a+x.v,0);
    if(!sum){el.innerHTML='<div class="empty">Aucun argent pour l’instant.</div>';return}
    const r=70,C=2*Math.PI*r;let off=0,arcs='';
    items.forEach(x=>{const l=x.v/sum*C;arcs+=`<circle r="${r}" cx="100" cy="100" fill="none" stroke="${x.b.color}" stroke-width="30" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=l;
      lg.innerHTML+=`<span><i style="background:${x.b.color}"></i>${esc(x.b.name)} ${Math.round(x.v/sum*100)} %</span>`});
    el.innerHTML=`<svg viewBox="0 0 200 200" style="max-width:260px;margin:auto">${arcs}<text x="100" y="106" text-anchor="middle" fill="currentColor" font-size="17" font-family="Georgia">${eur(sum)}</text></svg>`;
  }else if(view===1){
    const days=[...new Set(S.tx.map(t=>t.date))].sort();
    if(!days.length){el.innerHTML='<div class="empty">Ajoute un gain ou une dépense pour voir la courbe.</div>';return}
    let run=S.banks.reduce((a,b)=>a+b.init,0);
    const pts=[{d:'Départ',v:run}];
    days.forEach(d=>{run+=S.tx.filter(t=>t.date===d).reduce((a,t)=>a+t.amt,0);pts.push({d:d.slice(5).split('-').reverse().join('/'),v:run})});
    const W=320,H=180,p=24,mn=Math.min(...pts.map(x=>x.v)),mx=Math.max(...pts.map(x=>x.v)),rg=(mx-mn)||1;
    const X=i=>p+(pts.length>1?i/(pts.length-1):0.5)*(W-2*p),Y=v=>H-p-(v-mn)/rg*(H-2*p);
    const line=pts.map((x,i)=>`${X(i)},${Y(x.v)}`).join(' ');
    el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><polygon points="${X(0)},${H-p} ${line} ${X(pts.length-1)},${H-p}" fill="var(--acc)" opacity=".15"/><polyline points="${line}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/>${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="4" fill="var(--acc)"/>`).join('')}<text x="${p}" y="14" fill="var(--mut)" font-size="11">${eur(mx)}</text><text x="${p}" y="${H-6}" fill="var(--mut)" font-size="11">${eur(mn)}</text></svg>`;
    lg.innerHTML='<span>Total de ton argent, jour après jour</span>';
  }else{
    const ds=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push(d.toLocaleDateString('sv'))}
    const g=ds.map(d=>S.tx.filter(t=>t.date===d&&t.amt>0).reduce((a,t)=>a+t.amt,0));
    const l=ds.map(d=>-S.tx.filter(t=>t.date===d&&t.amt<0).reduce((a,t)=>a+t.amt,0));
    const mx=Math.max(1,...g,...l),W=320,H=180,mid=H/2,bw=(W-20)/14;
    let s=`<line x1="10" x2="${W-10}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>`;
    ds.forEach((d,i)=>{const x=10+i*bw+bw*.15,w=bw*.7,hg=g[i]/mx*(mid-14),hl=l[i]/mx*(mid-14);
      s+=`<rect x="${x}" y="${mid-hg}" width="${w}" height="${hg}" rx="3" fill="var(--gain)"/><rect x="${x}" y="${mid}" width="${w}" height="${hl}" rx="3" fill="var(--loss)"/>`;
      if(i%3===0)s+=`<text x="${x+w/2}" y="${H-2}" text-anchor="middle" fill="var(--mut)" font-size="9">${d.slice(8)}/${d.slice(5,7)}</text>`});
    el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
    lg.innerHTML='<span><i style="background:var(--gain)"></i>Reçu</span><span><i style="background:var(--loss)"></i>Dépensé</span><span>14 derniers jours</span>';
  }
}

function render(){
  $('total').textContent=eur(total());
  $('bank').innerHTML=S.banks.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
  $('banks').innerHTML=S.banks.length?S.banks.map(b=>{const v=bal(b);return `<div class="bank"><i class="dot" style="background:${b.color}"></i><span class="n">${esc(b.name)}</span><span class="num ${v<0?'l':''}">${eur(v)}</span><button class="x" aria-label="Supprimer" onclick="delBank('${b.id}')">✕</button></div>`}).join(''):'<div class="empty">Aucune banque. Ajoute ta première ci-dessous.</div>';
  const L=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,40);
  $('list').innerHTML=L.length?L.map(t=>{const b=S.banks.find(x=>x.id===t.bank);return `<div class="tx"><i class="dot" style="background:${b?b.color:'#888'}"></i><div>${esc(t.note||(t.amt>0?'Reçu':'Dépensé'))}<small>${t.date.split('-').reverse().join('/')} · ${b?esc(b.name):''}</small></div><b class="num ${t.amt>0?'g':'l'}">${t.amt>0?'+':''}${eur(t.amt)}</b><button class="x" aria-label="Supprimer" onclick="delTx('${t.id}')">✕</button></div>`}).join(''):'<div class="empty">Rien pour l’instant.</div>';
  chart();
}
function exp(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='bank-sauvegarde.json';a.click();
}
function imp(i){
  const f=i.files[0];if(!f)return;
  f.text().then(t=>{try{const d=JSON.parse(t);if(d.banks&&d.tx){S=d;save();render()}else alert('Fichier invalide')}catch(e){alert('Fichier invalide')}});
}
$('date').value=today();
setType(1);
render();
</script>
</body>
</html>
